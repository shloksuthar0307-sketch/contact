{% extends 'auth_base.html' %}

{% block title %}Forgot Password - ContactBook{% endblock %}

{% block auth_content %}
<div class="auth-header">
    <a href="{% url 'login' %}" style="display: inline-block; color: var(--text-muted); margin-bottom: 1.5rem; text-decoration: none; font-size: 0.875rem;">
        <i class="fa-solid fa-arrow-left"></i> Back to login
    </a>
    <h1>Reset your password</h1>
    <p>Enter your email and we'll send you a verification code.</p>
</div>

<form method="POST" action="{% url 'forgot_password' %}">
    {% csrf_token %}
    
    <div class="form-group">
        <label class="form-label" for="email">Email</label>
        <input class="form-input" type="email" id="email" name="email" required autocomplete="email" placeholder="you@example.com">
    </div>
    
    <div class="form-actions" style="margin-top: 2rem;">
        <button type="submit" class="btn-primary" style="width: 100%;">Send Verification Code</button>
    </div>
</form>
{% endblock %}
