<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Verification Code</title>
<style>
  body, table, td { margin: 0; padding: 0; }
  body {
    background-color: #08090B;
    font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif;
    color: #FFFFFF;
  }
  .wrapper {
    width: 100%;
    padding: 40px 0;
    background-color: #08090B;
  }
  .container {
    max-width: 480px;
    margin: 0 auto;
    background-color: #101216;
    border: 1px solid #1a1d24;
    border-radius: 12px;
    overflow: hidden;
  }
  .header {
    background-color: #15171C;
    padding: 28px 32px;
    text-align: center;
    border-bottom: 1px solid #1a1d24;
  }
  .header .logo {
    font-size: 20px;
    font-weight: 700;
    color: #FFFFFF;
    letter-spacing: -0.02em;
  }
  .header .logo span {
    color: #7c3aed;
  }
  .body-content {
    padding: 40px 32px 32px 32px;
    text-align: center;
  }
  .body-content h1 {
    font-size: 24px;
    color: #FFFFFF;
    margin: 0 0 12px 0;
    font-weight: 600;
  }
  .body-content p {
    font-size: 15px;
    line-height: 1.6;
    color: #a1a1aa;
    margin: 0 0 28px 0;
  }
  .otp-box {
    display: inline-block;
    background-color: rgba(124, 58, 237, 0.1);
    border: 1px solid rgba(124, 58, 237, 0.3);
    border-radius: 8px;
    padding: 18px 36px;
    margin-bottom: 28px;
  }
  .otp-code {
    font-family: monospace;
    font-size: 34px;
    font-weight: 700;
    letter-spacing: 12px;
    color: #7c3aed;
    margin-right: -12px; /* Fix offset from letter spacing */
  }
  .divider {
    border: none;
    border-top: 1px solid #1a1d24;
    margin: 0 32px;
  }
  .footer {
    padding: 24px 32px 32px 32px;
    text-align: center;
  }
  .footer p {
    font-size: 12px;
    color: #71717a;
    line-height: 1.6;
    margin: 0;
  }
</style>
</head>
<body>
  <table class="wrapper" role="presentation" width="100%" cellpadding="0" cellspacing="0">
    <tr>
      <td>
        <table class="container" role="presentation" cellpadding="0" cellspacing="0" align="center">
          <tr>
            <td class="header">
              <span class="logo">ContactBook<span>.</span></span>
            </td>
          </tr>
          <tr>
            <td class="body-content">
              <h1>Verify your identity</h1>
              <p>Use the one-time password below to complete your verification. Don't share this code with anyone.</p>

              <div class="otp-box">
                <span class="otp-code">{{ otp }}</span>
              </div>
            </td>
          </tr>
          <tr>
            <td><hr class="divider"></td>
          </tr>
          <tr>
            <td class="footer">
              <p>If you didn't request this code, you can safely ignore this email.<br>
              &copy; ContactBook. All rights reserved.</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
